name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run scrub:check
      - run: npm run check
      - run: npm test
      - run: ./scripts/check-action-pins.sh

  guard:
    uses: beliq-eu/.github/.github/workflows/guard.yml@8a358f57281a2f56d5c4e08b4c6caa1aedfd732c # main
