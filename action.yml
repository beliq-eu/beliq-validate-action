name: 'beliq e-invoice validate'
description: 'Validate e-invoices (XRechnung, ZUGFeRD, Factur-X, Peppol BIS, FatturaPA and more) in CI. Invalid documents fail the build.'
author: 'beliq'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  files:
    description: >-
      Newline- or comma-separated glob(s) of e-invoice files to validate.
      The default matches XML only; use '**/*.{xml,pdf}' to include hybrid
      ZUGFeRD/Factur-X PDFs. Matches under node_modules/, vendor/ and dist/
      are skipped, since each validated file is one call against your key. A
      glob that names one of those directories outright is honoured.
    required: false
    default: '**/*.xml'
  format:
    description: 'Force the input syntax: auto, cii, or ubl. Default auto-detects.'
    required: false
    default: 'auto'
  fail-on:
    description: 'Severity threshold that fails the job: error (default) or warning.'
    required: false
    default: 'error'
  api-key:
    description: 'Your beliq API key. Pass it from a repository secret.'
    required: true
  base-url:
    description: 'Override the beliq API base URL (self-hosted deployments only).'
    required: false
    default: ''
  cli-version:
    description: >-
      Version of beliq-cli to run (an exact version or an npm dist-tag).
      Defaults to the exact version this action release was tested against, so
      pinning the action also pins the validation logic. Pass `latest` to
      follow the CLI instead.
    required: false
    # renovate: datasource=npm depName=beliq-cli
    default: '0.4.0'
outputs:
  total:
    description: 'Number of files validated.'
    value: ${{ steps.run.outputs.total }}
  invalid:
    description: 'Number of files that failed: invalid, over the fail-on threshold, blocked by France CTC rules, or not checked.'
    value: ${{ steps.run.outputs.invalid }}
  results:
    description: >-
      JSON array of per-file results ({ file, status, format, errors, warnings,
      message, valid, verificationTier, verificationBadge, verificationBadgeLabel,
      franceCtcBlockingRuleIds, pdfInput }).
    value: ${{ steps.run.outputs.results }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/runner.mjs"
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        BELIQ_API_KEY: ${{ inputs.api-key }}